# Render Blueprint — https://render.com/docs/blueprint-spec

services:
  - type: web
    name: quietcord-api
    runtime: docker
    plan: free
    region: oregon
    repo: https://github.com/QuietCord/Backend
    branch: main
    healthCheckPath: /v1/
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PROMETHEUS
        value: "false"
      - key: PROXY_HEADER
        value: X-Forwarded-For
      - key: ROOT_REDIRECT
        value: https://github.com/QuietCord/Backend
      - key: DISCORD_CLIENT_ID
        value: "1553407390182019282"
      - key: DISCORD_REDIRECT_URI
        value: https://quietcord-api.onrender.com/v1/oauth/callback
      - key: PEPPER_SECRETS
        generateValue: true
      - key: PEPPER_SETTINGS
        generateValue: true
      # Render prompts on first Blueprint sync (not stored in git):
      - key: REDIS_URI
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
